<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel Trader</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }
    canvas {
      background: #111827;
      margin-top: 20px;
      border-radius: 10px;
      padding: 10px;
    }
    input {
      margin: 10px;
      padding: 5px;
    }
    #status {
      margin-top: 10px;
      color: yellow;
    }
  </style>
</head>
<body>

<h2>📊 Painel Macro</h2>

<div id="status">Carregando...</div>

<label>Início:</label>
<input type="time" id="inicio">

<label>Fim:</label>
<input type="time" id="fim">

<button onclick="carregar()">Filtrar</button>

<canvas id="grafico" width="1000" height="400"></canvas>

<script>
const API = "https://app-mercado-v1kt.onrender.com/historico"

let chart

async function carregar() {
  const status = document.getElementById("status")

  try {
    status.innerText = "Buscando dados..."

    const res = await fetch(API)

    if (!res.ok) {
      throw new Error("Erro ao acessar API")
    }

    let dados = await res.json()

    console.log("DADOS:", dados)

    if (!dados || dados.length === 0) {
      status.innerText = "⚠️ Sem dados ainda (aguarde coleta)"
      return
    }

    status.innerText = `OK: ${dados.length} pontos carregados`

    const inicio = document.getElementById("inicio").value
    const fim = document.getElementById("fim").value

    if (inicio && fim) {
      dados = dados.filter(d => {
        const hora = new Date(d.time).toTimeString().slice(0,5)
        return hora >= inicio && hora <= fim
      })
    }

    const labels = dados.map(d => new Date(d.time).toLocaleTimeString())

    const altas = dados.map(d => d.alta)
    const baixas = dados.map(d => d.baixa)
    const forca = dados.map(d => d.forca)
    const aceleracao = dados.map(d => d.aceleracao)

    if (chart) chart.destroy()

    const ctx = document.getElementById("grafico").getContext("2d")

    chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "Altas",
            data: altas,
            borderColor: "green",
            tension: 0.3
          },
          {
            label: "Quedas",
            data: baixas,
            borderColor: "red",
            tension: 0.3
          },
          {
            label: "Força",
            data: forca,
            borderColor: "cyan",
            tension: 0.3
          },
          {
            label: "Aceleração",
            data: aceleracao,
            borderColor: "yellow",
            tension: 0.3
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: { color: "white" }
          }
        },
        scales: {
          x: {
            ticks: { color: "white" }
          },
          y: {
            ticks: { color: "white" }
          }
        }
      }
    })

  } catch (err) {
    console.error(err)
    status.innerText = "❌ Erro: " + err.message
  }
}

// auto update
setInterval(carregar, 60000)

// iniciar
carregar()
</script>

</body>
</html>

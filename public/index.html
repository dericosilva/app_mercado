<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>App Mercado - WDO</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    canvas {
      max-width: 95%;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>📊 Mercado em Tempo Real</h1>

<canvas id="grafico"></canvas>

<script>
const URL = "https://app-mercado-v1kt.onrender.com/historico"

let chart

async function carregarDados() {
  try {
    const res = await fetch(URL)
    const data = await res.json()

    const labels = data.map(d => new Date(d.time).toLocaleTimeString())

    const alta = data.map(d => d.alta)
    const baixa = data.map(d => d.baixa)
    const forca = data.map(d => d.forca)
    const aceleracao = data.map(d => d.aceleracao)

    atualizarGrafico(labels, alta, baixa, forca, aceleracao)

  } catch (e) {
    console.log("Erro ao carregar:", e)
  }
}

function atualizarGrafico(labels, alta, baixa, forca, aceleracao) {

  if (chart) {
    chart.data.labels = labels
    chart.data.datasets[0].data = alta
    chart.data.datasets[1].data = baixa
    chart.data.datasets[2].data = forca
    chart.data.datasets[3].data = aceleracao
    chart.update()
    return
  }

  const ctx = document.getElementById("grafico").getContext("2d")

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [
        {
          label: "Alta",
          data: alta,
          borderWidth: 2,
          tension: 0.2,
          borderColor: "lime"
        },
        {
          label: "Baixa",
          data: baixa,
          borderWidth: 2,
          tension: 0.2,
          borderColor: "red"
        },
        {
          label: "Força (A-B)",
          data: forca,
          borderWidth: 2,
          tension: 0.2,
          borderColor: "cyan"
        },
        {
          label: "Aceleração",
          data: aceleracao,
          borderWidth: 2,
          tension: 0.2,
          borderColor: "yellow"
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          labels: {
            color: "white"
          }
        }
      },
      scales: {
        x: {
          ticks: { color: "white" }
        },
        y: {
          ticks: { color: "white" }
        }
      }
    }
  })
}

// 🔄 Atualiza automático
setInterval(carregarDados, 10000)

// 🚀 Primeira carga
carregarDados()
</script>

</body>
</html>
